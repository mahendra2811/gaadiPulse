project_id = "gaadipulse"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["gaadipulse://auth/callback"]
jwt_expiry = 3600
enable_signup = true

minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 900
otp_length = 6

[storage]
enabled = true

[functions.process-account-deletion]
verify_jwt = false

[auth.email.template.confirmation]
subject = "Welcome to GaadiPulse — verify your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your GaadiPulse sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your GaadiPulse password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your GaadiPulse email change"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Verify your GaadiPulse account"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.template.invite]
subject = "Your GaadiPulse account invitation"
content_path = "./supabase/templates/invite.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your GaadiPulse password was changed"
content_path = "./supabase/templates/password_changed.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Your GaadiPulse email address was changed"
content_path = "./supabase/templates/email_changed.html"

[auth.email.notification.phone_changed]
enabled = true
subject = "Your GaadiPulse phone number was changed"
content_path = "./supabase/templates/phone_changed.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "A sign-in method was added to GaadiPulse"
content_path = "./supabase/templates/identity_linked.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "A sign-in method was removed from GaadiPulse"
content_path = "./supabase/templates/identity_unlinked.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "A verification method was added to GaadiPulse"
content_path = "./supabase/templates/mfa_factor_enrolled.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "A verification method was removed from GaadiPulse"
content_path = "./supabase/templates/mfa_factor_unenrolled.html"
